# Render Infrastructure as Code for SaaS Project Management Platform
# Dashboard → New → Blueprint → select this repo → Apply.
# NOTE: service names must be unique in your Render account. If
# saas-pm-api / saas-pm-web are taken, rename them below AND update the
# two hardcoded https://*.onrender.com URLs to match.

services:
  # Backend API - Free Web Service (spins down after 15 min inactivity)
  - type: web
    name: saas-pm-api
    runtime: docker
    dockerfilePath: ./src/SaaSProjectManager.API/Dockerfile
    dockerContext: .
    plan: free
    region: oregon  # or frankfurt, singapore
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: saas-pm-db
          property: connectionString
      - key: Jwt__Secret
        sync: false  # Set manually in Render dashboard: openssl rand -base64 64
      - key: Jwt__Issuer
        value: SaaSProjectManager
      - key: Jwt__Audience
        value: SaaSProjectManager.Client
      - key: Jwt__AccessTokenMinutes
        value: "60"
      - key: Frontend__Url
        value: https://saas-pm-web.onrender.com
      - key: Render__FrontendUrl
        value: https://saas-pm-web.onrender.com
      - key: Redis__Connection
        sync: false  # Paste the INTERNAL Redis URL from the saas-pm-redis dashboard
      - key: ConnectionStrings__Redis
        sync: false  # Same value as Redis__Connection

  # Frontend - Free Static Site (Vite needs the full API URL at build time)
  - type: web
    name: saas-pm-web
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: frontend/saas-project-manager-web
    envVars:
      - key: VITE_API_URL
        value: https://saas-pm-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Redis - Free Key Value instance (internal access only)
  - type: redis
    name: saas-pm-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []  # no public access; API connects over Render's internal network

databases:
  # PostgreSQL - Free for 90 days, then $7/mo (or migrate to Neon/Supabase free tier)
  - name: saas-pm-db
    databaseName: saas_pm
    user: saas_pm_user
    plan: free
    region: oregon
