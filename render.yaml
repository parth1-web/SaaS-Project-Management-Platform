# Render Infrastructure as Code for SaaS Project Management Platform
# Deploy with: render deploy --config render.yaml
# Or connect repo in Render dashboard and it will auto-detect this file

services:
  # Backend API - Free Web Service (spins down after 15 min inactivity)
  - type: web
    name: saas-pm-api
    runtime: docker
    dockerfilePath: ./src/SaaSProjectManager.API/Dockerfile
    dockerContext: .
    plan: free
    region: oregon  # or frankfurt, singapore
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: saas-pm-db
          property: connectionString
      - key: Jwt__Secret
        sync: false  # Set manually in Render dashboard
      - key: Jwt__Issuer
        value: SaaSProjectManager
      - key: Jwt__Audience
        value: SaaSProjectManager.Client
      - key: Jwt__AccessTokenMinutes
        value: "60"
      - key: Frontend__Url
        fromService:
          name: saas-pm-web
          type: static
          property: hostport
      - key: Render__FrontendUrl
        fromService:
          name: saas-pm-web
          type: static
          property: hostport
      - key: Redis__Connection
        fromService:
          name: saas-pm-redis
          type: redis
          property: connectionString
      - key: ConnectionStrings__Redis
        fromService:
          name: saas-pm-redis
          type: redis
          property: connectionString

  # Frontend - Free Static Site
  - type: static
    name: saas-pm-web
    buildCommand: npm ci && npm run build
    publishPath: ./dist
    rootDir: frontend/saas-project-manager-web
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_URL
        fromService:
          name: saas-pm-api
          type: web
          property: hostport
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Database - Free PostgreSQL (90 days free, then $7/mo)
  - type: pserv
    name: saas-pm-db
    plan: free
    region: oregon
    databaseName: saas_pm
    user: saas_user
    ipAllowList: []  # Allow all for Render services

  # Redis - Free Redis
  - type: redis
    name: saas-pm-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru